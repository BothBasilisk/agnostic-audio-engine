# ==========================================================
# 1. DATASOURCE
# ==========================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/agnostic_ai
quarkus.datasource.username=agnostic_user
quarkus.datasource.password=agnostic_pass

# ==========================================================
# 2. HIBERNATE ORM
# ==========================================================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# ==========================================================
# 3. FLYWAY
# ==========================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ==========================================================
# 4. REST CLIENTS
# ==========================================================
quarkus.rest-client.dsp-worker.url=http://localhost:8001