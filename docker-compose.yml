version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: agnostic_db
    environment:
      - POSTGRES_USER=agnostic_user
      - POSTGRES_PASSWORD=agnostic_pass
      - POSTGRES_DB=agnostic_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vector:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: agnostic_storage
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Interface Port
    environment:
      - MINIO_ROOT_USER=admin_user
      - MINIO_ROOT_PASSWORD=admin_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc
    container_name: agnostic_storage_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin_user admin_password); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb myminio/audio-catalog --ignore-existing;
      /usr/bin/mc anonymous set download myminio/audio-catalog;
      echo 'Bucket successfully created!';
      exit 0;
      "

  dsp-worker:
    build: 
      context: ./dsp-worker
    container_name: agnostic_dsp_worker
    ports:
      - "8001:8001"
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  pgdata_vector:
  minio_data: